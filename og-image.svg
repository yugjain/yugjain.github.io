    <text x="333" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="-1.5">80%+ GRR</text>
    <text x="333" y="80" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14">GROSS LOGO RETENTION</text>

    <rect x="610" y="0" width="410" height="100" rx="16" fill="#FFFFFF" />
