  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#121215" stroke="#27272A" stroke-width="2" />
  
  <!-- Top Pill -->
  <rect x="90" y="95" width="460" height="42" rx="21" fill="#A3E635" />
